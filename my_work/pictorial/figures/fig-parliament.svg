<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img">
<title>Parliament of Things, speaking-for</title>
<rect width="1440" height="520" fill="#FFFFFF"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1.6 L8.2 5 L1 8.4" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1.6 L8.2 5 L1 8.4" fill="none" stroke="#1F5C57" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="40" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6" fill="#1F5C57">SPEAKING-FOR</text>
<text x="40" y="72" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A1A">Parliament of Things</text>
<text x="40" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">A material signal is carried into a civic turn by an authored proxy.</text>

<text x="40" y="168" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Soil</text>
<text x="40" y="188" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">humidity · CO₂</text>
<text x="40" y="206" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">live sensor</text>

<text x="40" y="286" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Breath</text>
<text x="40" y="306" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">a person in the room</text>
<text x="40" y="324" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">live</text>

<line x1="168" y1="160" x2="168" y2="300" stroke="#1F5C57" stroke-width="1.25"/>
<line x1="168" y1="160" x2="188" y2="160" stroke="#1F5C57" stroke-width="1.25"/>
<line x1="168" y1="300" x2="188" y2="300" stroke="#1F5C57" stroke-width="1.25"/>
<line x1="168" y1="230" x2="300" y2="230" stroke="#1F5C57" stroke-width="1.25"/>
<circle cx="168" cy="230" r="3.2" fill="#1F5C57"/>

<line x1="300" y1="230" x2="1320" y2="230" stroke="#1F5C57" stroke-width="1.25" marker-end="url(#arrA)"/>

<line x1="340" y1="218" x2="340" y2="242" stroke="#1A1A1A" stroke-width="1.25"/>
<text x="340" y="188" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Designer cut</text>
<text x="340" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">who may enter</text>
<text x="340" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">prompts I write</text>

<line x1="620" y1="218" x2="620" y2="242" stroke="#1A1A1A" stroke-width="1.25"/>
<text x="620" y="188" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Toolkit</text>
<text x="620" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">actor cards · soil map</text>
<text x="620" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">breathing column</text>

<line x1="900" y1="218" x2="900" y2="242" stroke="#1A1A1A" stroke-width="1.25"/>
<text x="900" y="188" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Civic turn</text>
<text x="900" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">a human sequence</text>
<text x="900" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">soil time is fitted in</text>

<line x1="1160" y1="218" x2="1160" y2="242" stroke="#1A1A1A" stroke-width="1.25"/>
<text x="1160" y="188" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Public gesture</text>
<text x="1160" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">a position</text>
<text x="1160" y="288" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">not ecological consent</text>

<path d="M1280 250 C1280 390, 200 390, 168 318" fill="none" stroke="#8A8A8A" stroke-width="1.15" stroke-dasharray="2 5" stroke-linecap="round"/>
<circle cx="168" cy="318" r="4" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.15"/>
<text x="520" y="378" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">No path returns consent to the soil.</text>

<line x1="40" y1="440" x2="64" y2="440" stroke="#1F5C57" stroke-width="1.25"/>
<text x="76" y="444" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">the relation: an authored proxy</text>
<line x1="320" y1="440" x2="344" y2="440" stroke="#8A8A8A" stroke-width="1.15" stroke-dasharray="2 4"/>
<text x="356" y="444" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">open ending: nothing goes back</text>
</svg>
