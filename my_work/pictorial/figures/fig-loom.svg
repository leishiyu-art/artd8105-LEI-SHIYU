<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img">
<title>Polyrhythm Loom, weaving-with</title>
<rect width="1440" height="820" fill="#FFFFFF"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1.6 L8.2 5 L1 8.4" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1.6 L8.2 5 L1 8.4" fill="none" stroke="#1F5C57" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="40" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6" fill="#1F5C57">WEAVING-WITH</text>
<text x="40" y="72" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A1A">Polyrhythm Loom</text>
<text x="40" y="98" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">Seven traces on the Cotai mudflat enter one field through rules I wrote.</text>

<text x="40" y="148" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.1" fill="#5E5E5E">AGENT</text>
<text x="280" y="148" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.1" fill="#5E5E5E">RHYTHM</text>
<text x="420" y="148" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.1" fill="#5E5E5E">STATUS</text>
<line x1="40" y1="160" x2="560" y2="160" stroke="#1A1A1A" stroke-width="1"/>

<text x="40" y="198" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Air · CO₂</text>
<text x="280" y="198" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">1 day</text>
<text x="420" y="198" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">live</text>
<line x1="560" y1="194" x2="860" y2="194" stroke="#1F5C57" stroke-width="1.25"/>

<text x="40" y="270" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Mangroves</text>
<text x="280" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">1 day</text>
<text x="420" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">live</text>
<line x1="560" y1="266" x2="860" y2="266" stroke="#1F5C57" stroke-width="1.25"/>

<text x="40" y="342" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Black-faced spoonbills</text>
<text x="280" y="342" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">tide · 1 year</text>
<text x="420" y="342" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">records</text>
<line x1="560" y1="338" x2="860" y2="338" stroke="#8A8A8A" stroke-width="1.15" stroke-dasharray="4 4"/>

<text x="40" y="414" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Tide</text>
<text x="280" y="414" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">12.42 h</text>
<text x="420" y="414" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">live</text>
<line x1="560" y1="410" x2="860" y2="410" stroke="#1F5C57" stroke-width="1.25"/>

<text x="40" y="486" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Mud · sediment</text>
<text x="280" y="486" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">12.42 h</text>
<text x="420" y="486" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">field</text>
<line x1="560" y1="482" x2="860" y2="482" stroke="#1F5C57" stroke-width="1.25"/>

<text x="40" y="558" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Instruments</text>
<text x="280" y="558" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">1 s</text>
<text x="420" y="558" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">live</text>
<line x1="560" y1="554" x2="860" y2="554" stroke="#1F5C57" stroke-width="1.25"/>

<text x="40" y="630" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Visitors · treadle</text>
<text x="280" y="630" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">a press</text>
<text x="420" y="630" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">one voice</text>
<line x1="560" y1="626" x2="860" y2="626" stroke="#1A1A1A" stroke-width="0.9"/>

<text x="40" y="528" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">Distant quakes enter on the mud row, as interruption, not as an eighth agent.</text>

<rect x="900" y="168" width="500" height="470" fill="none" stroke="#1A1A1A" stroke-width="1"/>
<text x="924" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.2" fill="#1F5C57">AUTHORED GRAMMAR</text>
<text x="924" y="228" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">The score</text>
<text x="924" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">which value becomes a pick</text>
<text x="924" y="272" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">is a rule, not an observation</text>
<line x1="924" y1="296" x2="1360" y2="296" stroke="#1A1A1A" stroke-width="1"/>

<text x="924" y="340" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Screen</text>
<text x="924" y="362" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">the field continues</text>
<text x="924" y="382" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">when nobody presses</text>
<line x1="924" y1="404" x2="1080" y2="404" stroke="#1F5C57" stroke-width="1.25"/>

<text x="1140" y="340" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1A1A1A">Textile</text>
<text x="1140" y="362" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">acrylic layers</text>
<text x="1140" y="382" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1F5C57">proposed</text>
<line x1="1140" y1="404" x2="1320" y2="404" stroke="#8A8A8A" stroke-width="1.15" stroke-dasharray="4 4"/>

<text x="924" y="470" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">The treadle is a backup input.</text>
<text x="924" y="492" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">It does not set the pace.</text>
<text x="924" y="540" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1A1A1A">Cotai mudflat · one site</text>
<text x="924" y="562" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">Spoonbill presence is from records,</text>
<text x="924" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">not a live count.</text>

<line x1="40" y1="740" x2="64" y2="740" stroke="#1F5C57" stroke-width="1.25"/>
<text x="76" y="744" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">live or field</text>
<line x1="200" y1="740" x2="224" y2="740" stroke="#8A8A8A" stroke-width="1.15" stroke-dasharray="4 4"/>
<text x="236" y="744" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">records or proposed</text>
<line x1="420" y1="740" x2="444" y2="740" stroke="#1A1A1A" stroke-width="0.9"/>
<text x="456" y="744" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5E5E5E">visitor, one voice</text>
</svg>
