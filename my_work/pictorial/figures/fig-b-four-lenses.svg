<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="300" viewBox="0 0 1440 300" role="img">
<title>Four analytical lenses</title>
<rect width="1440" height="300" fill="#FFFFFF"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1.6 L8.2 5 L1 8.4" fill="none" stroke="#1A1A1A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1.6 L8.2 5 L1 8.4" fill="none" stroke="#1F5C57" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="40" y="42" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6" fill="#1F5C57">FIGURE B</text>
<text x="40" y="74" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1A1A1A">Four lenses for reading a probe</text>
<text x="40" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">The same four questions are asked of each probe. They are an apparatus, not a score.</text>
<line x1="40" y1="124" x2="1400" y2="124" stroke="#1A1A1A" stroke-width="1"/>

<text x="40" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.2" fill="#1F5C57">01</text>
<text x="40" y="200" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">Agents and relations</text>
<text x="40" y="228" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">Who and what produce the trace?</text>

<text x="390" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.2" fill="#1F5C57">02</text>
<text x="390" y="200" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">Time and rhythm</text>
<text x="390" y="228" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">Whose time sets the pace?</text>

<text x="740" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.2" fill="#1F5C57">03</text>
<text x="740" y="200" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">Perception and action</text>
<text x="740" y="228" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">What is sensed, and what can be done?</text>

<text x="1090" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.2" fill="#1F5C57">04</text>
<text x="1090" y="200" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1A1A1A">My position</text>
<text x="1090" y="228" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5E5E5E">Where is the cut, and what does it leave out?</text>
</svg>
